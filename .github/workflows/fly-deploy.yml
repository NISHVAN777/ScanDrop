name: Test and deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never run two deploys at once
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Check that the Fly.io token is set
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Add a repository secret named FLY_API_TOKEN (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Read app name and region from fly.toml
        run: |
          echo "APP=$(grep -E '^app *=' fly.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"
          echo "REGION=$(grep -E '^primary_region *=' fly.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"
          echo "VOLUME=$(grep -A2 '^\[\[mounts\]\]' fly.toml | grep -E '^ *source *=' | cut -d'"' -f2)" >> "$GITHUB_ENV"

      - name: Create the app (first deploy only)
        env:
          # Repository variable naming the Fly.io organization to create the app in.
          FLY_ORG: ${{ vars.FLY_ORG }}
        run: |
          if flyctl status --app "$APP" > /dev/null 2>&1; then
            echo "App $APP already exists."
            exit 0
          fi
          echo "Fly.io organizations this token can use:"
          flyctl orgs list || true
          if [ -z "$FLY_ORG" ]; then
            echo "::error::Set a repository variable FLY_ORG to the organization slug to deploy into (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          flyctl apps create "$APP" --org "$FLY_ORG"

      - name: Create the storage volume (first deploy only)
        run: |
          if ! flyctl volumes list --app "$APP" --json | grep -q "\"$VOLUME\""; then
            flyctl volumes create "$VOLUME" --app "$APP" --region "$REGION" --size 1 --yes
          fi

      # A machine can't switch volumes in place. If fly.toml now names a different
      # volume, remove machines still attached to the old one; the deploy below
      # starts a fresh machine on the new volume. Volumes themselves are kept.
      - name: Replace machines still using an old volume
        run: |
          flyctl machines list --app "$APP" --json \
            | jq -r --arg v "$VOLUME" '.[] | select(((.config.mounts // []) | length) > 0 and (((.config.mounts // []) | map(.name) | index($v)) == null)) | .id' \
            | while read -r id; do
                [ -z "$id" ] && continue
                echo "Replacing machine $id (attached to an old volume)"
                flyctl machines destroy "$id" --app "$APP" --force
              done

      - name: Deploy
        run: flyctl deploy --remote-only --ha=false

      - name: Show the live address
        run: echo "ScanDrop is live at https://$APP.fly.dev" >> "$GITHUB_STEP_SUMMARY"
