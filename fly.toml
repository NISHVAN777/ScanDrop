# Fly.io configuration for ScanDrop
# Docs: https://fly.io/docs/reference/configuration/

app = "scandrop-nishvan"
primary_region = "sin"          # Singapore (closest Fly.io region to India)
kill_signal = "SIGTERM"         # lets the app save its file list before stopping
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  STORAGE_DIR = "/data"
  MAX_FILE_MB = "1024"          # largest single upload: 1 GB
  MAX_STORAGE_GB = "2.5"        # keep total usage under the 3 GB volume

# Uploaded files live on this persistent volume (created by the deploy workflow).
[[mounts]]
  source = "scandrop_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Sleep when idle to save money, and wake automatically on the next request.
  # Fly only puts the machine to sleep when it has no open connections, so a
  # direct transfer or an upload in progress keeps it awake until it finishes.
  # "suspend" saves the machine's memory, so waking takes about a second.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
